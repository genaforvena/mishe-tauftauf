[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mishe-tauftauf"
version = "0.1.0"
description = "An observation-driven runtime: signals, short-lived wakes and durable minds for a self-observing, self-correcting mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
authors = [{ name = "genaforvena" }]
dependencies = ['tomli>=1.1; python_version < "3.11"']

[project.optional-dependencies]
laya = ["laya==0.3.5"]
code-map = ["tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26", "tree-sitter-rust>=0.24,<0.25"]

[project.scripts]
mishe-tauftauf = "mishe_tauftauf.cli:main"
mishe = "mishe_tauftauf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mishe_tauftauf = ["seed_*.md"]
