[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mishe-tauftauf"
version = "0.1.0"
description = "A plantable text-and-tmux core for a self-observing, self-correcting mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
authors = [{ name = "genaforvena" }]
dependencies = []

[project.optional-dependencies]
laya = ["laya==0.3.5"]

[project.scripts]
mishe-tauftauf = "mishe_tauftauf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mishe_tauftauf = ["seed_*.md"]
