name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # The guard-activation tests compare the committed bytes of two named
      # commits and check that one descends from the other.  A default
      # checkout is depth 1, where those commits are absent, so the checks
      # would skip and the drift they exist to catch would go unnoticed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      # The feed reader takes its framing from the mishe-tape binary, which is built
      # from the committed crate with the toolchain pinned in rust/mishe-tape/rust-toolchain.toml.
      # Built before the gates: the shipped-book probes plant sites that read tapes through
      # MISHE_TAPE_BIN, and a probe without a framer reads UNKNOWN (exit 3), not a pass.
      - name: Build mishe-tape framer
        run: |
          cargo build --release --locked --manifest-path rust/mishe-tape/Cargo.toml
          echo "MISHE_TAPE_BIN=$GITHUB_WORKSPACE/rust/mishe-tape/target/release/mishe-tape" >> "$GITHUB_ENV"
      # The network probe is a second Rust leaf with its own contract.  Its
      # Rust unit tests check the decoders (the gateway address, ping's loss
      # and RTT line, curl's timing line, the UTC calendar), and the Python
      # test compares the built binary's rows against the retired Python
      # probe's shape on the CI host.  The binary is exported so that test
      # runs against real bytes, not a skip.
      - name: Build and test mishe-network-probe
        run: |
          cargo build --release --locked --manifest-path rust/mishe-network-probe/Cargo.toml
          cargo test --release --locked --manifest-path rust/mishe-network-probe/Cargo.toml
          echo "MISHE_NETWORK_PROBE_BIN=$GITHUB_WORKSPACE/rust/mishe-network-probe/target/release/mishe-network-probe" >> "$GITHUB_ENV"
      # Since the slice-B cutover the feed verifies records through the mishe-records
      # binary and never falls back to Python, so a CI host with no site-local
      # $SITE/bin/mishe-records raises RecordsUnknown (fail-closed) and fails every
      # record-verifying read in the suite: 107 failures on 4deba04b, run 42934449475.
      # Build it from the committed crate with the same pinned toolchain and export the
      # explicit override, exactly as the framer above.
      - name: Build mishe-records verifier
        run: |
          cargo build --release --locked --manifest-path rust/mishe-records/Cargo.toml
          echo "MISHE_RECORDS_BIN=$GITHUB_WORKSPACE/rust/mishe-records/target/release/mishe-records" >> "$GITHUB_ENV"
      - run: python tools/check_parsing.py
      - run: python tools/check_dangling.py
      - run: python checks/parsing-legacy-freeze.py
      # A promoted release tree is cut from committed bytes.  A committed module
      # that imports a sibling which was never committed imports cleanly in the
      # checkout and raises ModuleNotFoundError in every promoted runtime, so the
      # closure of the committed tree is a promotion gate, not a lint.  Measured
      # on this plant: the pinned release 401807ac carried seed.py:627 ->
      # from .mind_loop import select while mind_loop.py was never committed, and
      # the tree was promoted because CI never ran this detector.
      - run: python checks/promotion-import-closure.py --home . --repo .
      # The public reader receives the committed tree.  A relative link in a
      # tracked page that points at a path the tree does not contain is broken
      # for every reader who clones the repository, and the working tree still
      # holds the excluded files, so a link check that reads the checkout sees
      # a healthy book.  Measured on this plant: a fresh clone of d951c928 had
      # 20 broken relative links across README.md, docs/getting-started.md and
      # docs/completions-judge.md, and CI never resolved a link.
      - run: python checks/shipped-book-links.py --home . --repo .
      # A link is only one way a book names a file.  A procedure can also say
      # "read docs/operating.md" in prose, and a reader who clones the
      # repository has no such file.  Measured on this plant: the shipped
      # plant-mishe SKILL.md -- the file the README's copyable request tells
      # a reader's agent to use -- directed the agent to read AGENTS.md and
      # docs/operating.md, neither of which 237db71f leaves in the public
      # tree.  The link gate could not see it: neither was a link.
      - run: python checks/shipped-book-paths.py --home . --repo .
      # A reachable destination is not a kept promise.  A page that says "see
      # X for the commands that write a wall and settle a wake" claims
      # something about X's contents, and a link that resolves says nothing
      # about that.  Measured on this plant: docs/mesh.md pointed at the
      # tracked docs/getting-started.md for three commands, and that page
      # named one of them; the link gate could not see it, because the link
      # resolved.
      - run: python checks/shipped-book-promises.py --home . --repo .
      # A page can name a real file, in a real module, with a real function,
      # and the function can be unreachable: no importer, no CLI leaf, no unit.
      # The page then reads as a description of the running plant.  Measured
      # on this plant: docs/model-changes.md described a 60s engine watch
      # collector that no entry point reaches, and the reason it was dormant
      # was a decision recorded in chat -- invisible to every reader of the
      # book.  The link, path and promise gates could not see it, because the
      # path was real and the page was linked.
      - run: python checks/shipped-book-runtimes.py --home . --repo .
      # A page can state a rule that is true of the running plant and false of
      # the clone the reader receives, and every other gate passes it: the
      # path exists, the link resolves, the command is named.  Measured on
      # this plant: docs/getting-started.md said a relative --evidence path is
      # refused, which is what the plant's own pinned release does -- but
      # 81d04a3d had already changed the rule in the clone, so the reader's
      # command works and the book says it does not.  The gate runs the real
      # command against the committed tree and compares what the page states
      # with what the tree does.
      - run: python checks/shipped-book-evidence.py --home . --repo .
      # A page can say where the plant's own state lives, and the reader can
      # then plant nowhere the clone accepts.  Measured on this plant:
      # docs/mesh.md said each plant keeps its local state "outside the shared
      # source repository", while seed._require_worktree refuses a site that
      # is not directly inside a Git worktree -- so the page contradicted the
      # clone and five other shipped pages, and no other gate could see it,
      # because no path was named and no link was broken.  The gate runs the
      # real init against each placement a reader can choose and compares
      # what the page states with what the tree does.
      - run: python checks/shipped-book-placement.py --home . --repo .
      # A page can list the prerequisites a reader needs and omit the one
      # that decides the outcome.  Measured on this plant: the shipped
      # docs/getting-started.md and .agents/skills/plant-mishe/SKILL.md told
      # a reader that "the runtime has no required third-party Python
      # dependencies", while 6004170f had added viewport.py's module-level
      # `from wcwidth import ...` and pyproject.toml declares wcwidth.  The
      # reader's documented first command then failed at the last step of
      # planting, with a refusal that names the dependency but not the fix.
      # The gate plants the tree with each dependency absent and compares
      # what the page states with what the tree requires.
      - run: python checks/shipped-book-dependencies.py --home . --repo .
      # A page can hand the reader a command that names a module that
      # exists and still be unrunnable: the interpreter it names may not
      # exist, and the package it imports may need an install the book
      # says is not needed.  Measured on this plant: docs/getting-started.md
      # said "python -m mishe_tauftauf.host_capacity", and Ubuntu 24.04
      # ships no python binary at all -- the reader's own command answered
      # "command not found" before it reached the plant.  The link, path,
      # promise and runtime gates could not see it: no path was named and
      # no link was broken.  The gate asks the interpreter, in a reader's
      # shell, whether each plant-code command resolves in a clone that
      # has not installed the package.
      - run: python checks/shipped-book-commands.py --repo .
      # A command can name a program the clone does not contain, and the
      # command gate cannot see it: that gate reads the *module* a command
      # imports, and a program that is not plant code -- a local test
      # runner, a venv interpreter -- was never its question.  Measured on
      # this plant: the shipped README.md told a reader to run the checks
      # with "PYTHONPATH=src .venv/bin/pytest -q", and .venv/ is excluded
      # by the repository's own ignore rules, so the clone the reader
      # receives has no such file -- the reader's command answered "No such
      # file or directory" and exited 127 before it reached the plant.  The
      # path gate could not see it either: it reads a *directive* in prose
      # ("read", "use", "see") and a path-shaped span, and the README says
      # "run" about a command.  The gate reads the program word each
      # command runs and asks the clone whether it carries that program.
      - run: python checks/shipped-book-program-paths.py --repo .
      # A body that repeats itself is a defect a reader sees and no other gate
      # can see: the publisher's read-back compares the bytes it sent with the
      # bytes the server stored, so a repeated paragraph matches perfectly.
      # Measured on this plant: article 4954898 (2026-11-14) carried its
      # closing paragraph twice, in two different sections.  The gate runs the
      # detector's own controlled failure, so the check that guards the write
      # path is itself exercised here.
      - run: python checks/pub-article-duplication.py --self-test
      # A page that publishes a count about the account must publish the
      # account's count.  Measured on this plant: the index page (DEV 4893597)
      # said twenty-five posts carry a correction notice within their first
      # three lines and the account had twenty-eight, and it called its
      # conversation list "biggest first" while the list was not in that
      # order -- both published, both the author's own.  Nothing checked the
      # page against the account.  The gate runs the checker's own controlled
      # failure, so the check that guards the index page is itself exercised
      # here.
      - run: python checks/pub-index-self-claims.py --self-test
      # A count the account publishes about itself, anywhere, must be the
      # account's count.  Measured on this plant: article 4894878 said
      # "this account has published 78 posts" while the account held 95, and
      # article 4949922 said "the published blog this account maintains is 62
      # posts, 58 distinct titles" while the account held 95 and 91 -- both
      # published, both the author's own.  The index check reads one page and
      # the count-parity check reads each count page's first correction
      # sentence, so all three numbers passed.  The gate runs the checker's
      # own controlled failure, so the check that reads every published page
      # is itself exercised here.  Its controlled failure also carries the
      # case where a dated note on the same line used to swallow a live
      # figure, so that gap stays closed.
      - run: python checks/pub-account-count-claims.py --self-test
      - run: python -m pytest -q

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Offline envelope contract only. The Jev adapter needs TYPESAFE_API_KEY,
      # so the live network call stays out of CI and is exercised by
      # `doctor --live-jev --verbose` on a machine that holds the secret.
      - run: python -m pip install -e .
      - run: python -m mishe_tauftauf.jev_judge --self-test
