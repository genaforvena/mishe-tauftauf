name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # The guard-activation tests compare the committed bytes of two named
      # commits and check that one descends from the other.  A default
      # checkout is depth 1, where those commits are absent, so the checks
      # would skip and the drift they exist to catch would go unnoticed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python tools/check_parsing.py
      - run: python checks/parsing-legacy-freeze.py
      # A promoted release tree is cut from committed bytes.  A committed module
      # that imports a sibling which was never committed imports cleanly in the
      # checkout and raises ModuleNotFoundError in every promoted runtime, so the
      # closure of the committed tree is a promotion gate, not a lint.  Measured
      # on this plant: the pinned release 401807ac carried seed.py:627 ->
      # from .mind_loop import select while mind_loop.py was never committed, and
      # the tree was promoted because CI never ran this detector.
      - run: python checks/promotion-import-closure.py --home . --repo .
      # The public reader receives the committed tree.  A relative link in a
      # tracked page that points at a path the tree does not contain is broken
      # for every reader who clones the repository, and the working tree still
      # holds the excluded files, so a link check that reads the checkout sees
      # a healthy book.  Measured on this plant: a fresh clone of d951c928 had
      # 20 broken relative links across README.md, docs/getting-started.md and
      # docs/completions-judge.md, and CI never resolved a link.
      - run: python checks/shipped-book-links.py --home . --repo .
      # A link is only one way a book names a file.  A procedure can also say
      # "read docs/operating.md" in prose, and a reader who clones the
      # repository has no such file.  Measured on this plant: the shipped
      # plant-mishe SKILL.md -- the file the README's copyable request tells
      # a reader's agent to use -- directed the agent to read AGENTS.md and
      # docs/operating.md, neither of which 237db71f leaves in the public
      # tree.  The link gate could not see it: neither was a link.
      - run: python checks/shipped-book-paths.py --home . --repo .
      # A reachable destination is not a kept promise.  A page that says "see
      # X for the commands that write a wall and settle a wake" claims
      # something about X's contents, and a link that resolves says nothing
      # about that.  Measured on this plant: docs/mesh.md pointed at the
      # tracked docs/getting-started.md for three commands, and that page
      # named one of them; the link gate could not see it, because the link
      # resolved.
      - run: python checks/shipped-book-promises.py --home . --repo .
      # A page can name a real file, in a real module, with a real function,
      # and the function can be unreachable: no importer, no CLI leaf, no unit.
      # The page then reads as a description of the running plant.  Measured
      # on this plant: docs/model-changes.md described a 60s engine watch
      # collector that no entry point reaches, and the reason it was dormant
      # was a decision recorded in chat -- invisible to every reader of the
      # book.  The link, path and promise gates could not see it, because the
      # path was real and the page was linked.
      - run: python checks/shipped-book-runtimes.py --home . --repo .
      # A page can state a rule that is true of the running plant and false of
      # the clone the reader receives, and every other gate passes it: the
      # path exists, the link resolves, the command is named.  Measured on
      # this plant: docs/getting-started.md said a relative --evidence path is
      # refused, which is what the plant's own pinned release does -- but
      # 81d04a3d had already changed the rule in the clone, so the reader's
      # command works and the book says it does not.  The gate runs the real
      # command against the committed tree and compares what the page states
      # with what the tree does.
      - run: python checks/shipped-book-evidence.py --home . --repo .
      # A page can say where the plant's own state lives, and the reader can
      # then plant nowhere the clone accepts.  Measured on this plant:
      # docs/mesh.md said each plant keeps its local state "outside the shared
      # source repository", while seed._require_worktree refuses a site that
      # is not directly inside a Git worktree -- so the page contradicted the
      # clone and five other shipped pages, and no other gate could see it,
      # because no path was named and no link was broken.  The gate runs the
      # real init against each placement a reader can choose and compares
      # what the page states with what the tree does.
      - run: python checks/shipped-book-placement.py --home . --repo .
      # A page can list the prerequisites a reader needs and omit the one
      # that decides the outcome.  Measured on this plant: the shipped
      # docs/getting-started.md and .agents/skills/plant-mishe/SKILL.md told
      # a reader that "the runtime has no required third-party Python
      # dependencies", while 6004170f had added viewport.py's module-level
      # `from wcwidth import ...` and pyproject.toml declares wcwidth.  The
      # reader's documented first command then failed at the last step of
      # planting, with a refusal that names the dependency but not the fix.
      # The gate plants the tree with each dependency absent and compares
      # what the page states with what the tree requires.
      - run: python checks/shipped-book-dependencies.py --home . --repo .
      - run: python -m pytest -q

  tmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_tmux.py -q
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Offline envelope contract only. The Jev adapter needs TYPESAFE_API_KEY,
      # so the live network call stays out of CI and is exercised by
      # `doctor --live-jev --verbose` on a machine that holds the secret.
      - run: python -m pip install -e .
      - run: python -m mishe_tauftauf.jev_judge --self-test
  native-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test src/mishe_tauftauf/native/wire-usage.test.ts src/mishe_tauftauf/native/fetch-budget.test.ts src/mishe_tauftauf/native/native-session.test.ts
